<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片识别 - 智能垃圾分类识别系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="image">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">R</span><span>智能垃圾分类识别系统</span></a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="image.html">图片识别</a>
        <a href="camera.html">实时识别</a>
        <a href="history.html">历史记录</a>
        <a href="knowledge.html">分类知识</a>
        <a href="recycle.html">回收导航</a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    <div class="page-head">
      <div>
        <h1>图片识别</h1>
        <p>上传图片后，系统返回垃圾类别、置信度、投放建议和检测框。</p>
      </div>
      <span class="tag">JPG / PNG</span>
    </div>

    <section class="grid two">
      <div class="card">
        <div class="card-title"><h2>上传图片</h2><span>单张识别</span></div>
        <div id="uploadArea" class="upload-area">
          <strong>点击选择图片，或拖入图片</strong>
          <span class="muted">建议主体清晰、背景干扰少</span>
          <input id="imageInput" type="file" accept="image/*" hidden>
        </div>
        <div id="previewBox" class="preview-box hidden">
          <img id="previewImage" alt="预览图">
          <canvas id="uploadCanvas"></canvas>
        </div>
        <div id="uploadError" class="alert mt hidden"></div>
        <button id="predictBtn" class="primary mt" disabled>开始识别</button>
      </div>

      <div class="card">
        <div class="card-title"><h2>识别结果</h2><span id="resultGroup">等待识别</span></div>
        <div id="uploadEmpty" class="empty">上传并识别后显示结果</div>
        <div id="uploadResult" class="hidden">
          <div class="result-main">
            <div>
              <div class="muted">类别</div>
              <div id="classResult" class="result-name">-</div>
            </div>
            <div id="confResult" class="confidence">0%</div>
          </div>
          <div class="info-list">
            <div class="info-row"><strong>投放建议：</strong><span id="adviceResult">-</span></div>
            <div class="info-row"><strong>识别框：</strong><span id="boxCount">0</span> 个</div>
          </div>
          <div id="boxList" class="info-list mt"></div>
          <div class="actions">
            <button id="scienceBtn">查看分类知识</button>
            <button id="recycleBtn">查询回收点</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
