<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史记录 - 智能垃圾分类识别系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="history">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">R</span><span>智能垃圾分类识别系统</span></a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="image.html">图片识别</a>
        <a href="camera.html">实时识别</a>
        <a href="history.html">历史记录</a>
        <a href="knowledge.html">分类知识</a>
        <a href="recycle.html">回收导航</a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    <div class="page-head">
      <div>
        <h1>历史记录</h1>
        <p>查看、搜索和删除图片上传或摄像头识别记录。</p>
      </div>
    </div>
    <section class="card">
      <div class="form-row">
        <input id="historySearchInput" type="search" placeholder="搜索类别、建议或方式">
        <select id="historyModeFilter">
          <option value="">全部方式</option>
          <option value="upload">图片上传</option>
          <option value="camera">摄像头识别</option>
        </select>
        <button id="clearHistoryBtn" class="danger">清空记录</button>
      </div>
      <div class="table-wrap mt">
        <table>
          <thead>
            <tr>
              <th>类别</th>
              <th>归属分类</th>
              <th>置信度</th>
              <th>方式</th>
              <th>时间</th>
              <th>建议</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>
      </div>
      <div id="historyEmpty" class="empty mt hidden">暂无历史记录</div>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
