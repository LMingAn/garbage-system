<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回收导航 - 智能垃圾分类识别系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="recycle">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">R</span><span>智能垃圾分类识别系统</span></a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="image.html">图片识别</a>
        <a href="camera.html">实时识别</a>
        <a href="history.html">历史记录</a>
        <a href="knowledge.html">分类知识</a>
        <a href="recycle.html">回收导航</a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    <div class="page-head">
      <div>
        <h1>回收导航</h1>
        <p>选择垃圾类别，查询附近回收点或跳转地图搜索。</p>
      </div>
    </div>
    <section class="grid two">
      <div class="card">
        <div class="card-title"><h2>查询条件</h2><span>类别 + 定位</span></div>
        <div class="form-row">
          <select id="recycleClassSelect"></select>
          <button id="searchRecycleBtn" class="primary">查询回收点</button>
        </div>
        <p class="muted mt">浏览器允许定位时会按当前位置查询；未授权定位时返回地图搜索入口。</p>
      </div>
      <div class="card">
        <div class="card-title"><h2>查询结果</h2><span id="recycleStatus">等待查询</span></div>
        <div id="recycleResult" class="empty">请选择类别并查询</div>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
